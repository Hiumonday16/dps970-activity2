# GitHub Actions workflow: runs all tests automatically on every push / pull request.
name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Download the repository code onto the runner
      - uses: actions/checkout@v4
      # Install Python
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Install dependencies (pytest)
      - run: pip install -r requirements.txt
      # Run the tests
      - run: pytest -v
